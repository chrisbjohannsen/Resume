name: Markdown to PDF and HTML

on:
  push:
    branches:
      - master
      - sept-2024
    paths:
      - '**.md'

jobs:
  convert-to-pdf:
    name: BuildPDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            resume.md
          sparse-checkout-cone-mode: false

      - uses: baileyjm02/markdown-to-pdf@v1
        with:
          input_path: resume.md
          output_dir: pdf
          build_html: false

      - uses: actions/upload-artifact@v4
        with:
          name: resume.pdf
          path: pdf

  publish-release:
    needs: convert-to-pdf
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: resume.pdf

      - uses: ncipollo/release-action@v1
        with:
          tag: "resume-${{ github.run_number }}"
          name: "Resume PDF ${{ github.run_number }}"
          artifacts: "resume.pdf"
          allowUpdates: true